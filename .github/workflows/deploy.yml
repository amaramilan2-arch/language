name: Déploiement

# L'application est publiée à chaque fusion sur main. Aucune étape manuelle :
# une publication qui demande une manipulation finit par ne plus être faite.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois, sans annuler celle en cours : interrompre un
# déploiement à mi-chemin peut laisser le site dans un état incohérent.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Prérequis, à faire une seule fois et à la main :
      #   Settings → Pages → Source → « GitHub Actions ».
      #
      # `enablement: true` a été essayé pour automatiser ce réglage : la
      # création d'un site Pages par l'API exige des droits d'administration
      # que le GITHUB_TOKEN des Actions ne porte pas, quelles que soient les
      # permissions déclarées ci-dessus. L'action échoue alors sur
      # « Resource not accessible by integration ». Une fois Pages activé,
      # cette étape se contente de lire la configuration, ce qui passe.
      #
      # Second prérequis : GitHub Pages n'existe pas sur un dépôt privé en
      # formule gratuite. Le dépôt doit être public, ou le compte en Pro.
      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # Le site est servi sous le nom du dépôt, pas à la racine du domaine.
      # `base_path` est fourni par l'étape précédente, ce qui évite de coder le
      # nom du dépôt en dur ici.
      - name: Construire
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
